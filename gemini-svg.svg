<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="100%" height="100%">
  <!-- Symbole de centralisation (Hub / Atome) -->
  <g transform="translate(10, 0)">
    <!-- Orbites -->
    <ellipse cx="130" cy="100" rx="35" ry="85" fill="none" stroke="#002B5B" stroke-width="9" />
    <ellipse cx="130" cy="100" rx="35" ry="85" fill="none" stroke="#002B5B" stroke-width="9" transform="rotate(60 130 100)" />
    <ellipse cx="130" cy="100" rx="35" ry="85" fill="none" stroke="#002B5B" stroke-width="9" transform="rotate(-60 130 100)" />

    <!-- Noyau central -->
    <circle cx="130" cy="100" r="22" fill="#FF6B00" />

    <!-- Satellites extérieurs -->
    <circle cx="38" cy="100" r="13" fill="#002B5B" />
    <circle cx="176" cy="20" r="13" fill="#002B5B" />
    <circle cx="176" cy="180" r="13" fill="#002B5B" />
  </g>

  <!-- Typographie -->
  <text x="270" y="132" font-family="'Montserrat', 'Poppins', 'Inter', sans-serif" font-size="110" font-weight="800" fill="#002B5B" letter-spacing="-3.5">
    sukulu<tspan fill="#FF6B00">.</tspan>
  </text>
</svg>
